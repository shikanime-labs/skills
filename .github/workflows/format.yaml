name: format

on:
  pull_request:

permissions:
  contents: read

jobs:
  rumdl:
    name: rumdl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: rumdl check
        run: uvx rumdl check skills/

  # ponytail: treefmt --fail-on-change deferred until the devlib generator
  # emits a format check in nix.yaml; main is already treefmt-dirty on eval files.
