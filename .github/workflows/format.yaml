name: format

on:
  pull_request:

permissions:
  contents: read

jobs:
  rumdl:
    name: rumdl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: rumdl check
        run: uvx rumdl check skills/

  # ponytail: treefmt --fail-on-change deferred until the devlib generator
  # emits a format check in nix.yaml; main is already treefmt-dirty on eval files.
