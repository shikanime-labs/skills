agent:
  disabled_toolsets:
    - homeassistant
    - spotify
    - video_gen
    - x_search
  max_turns: 150
browser:
  cloud_provider: nous
  use_gateway: false
curator:
  consolidate: true
custom_providers:
  - name: shikanime-anthropic
    api_mode: anthropic_messages
    base_url: https://inference.i.shikanime.studio/anthropic
    key_env: SKS_API_KEY
    model: z-ai/glm-5.3-flash
    models:
      - z-ai/glm-5.3-flash
      - z-ai/glm-5.3
      - qwen/qwen3.8-27b
      - qwen/qwen3.8-flash
      - deepseek/deepseek-v4-flash
  - name: shikanime-openai
    api_mode: chat_completions
    base_url: https://inference.i.shikanime.studio/v1
    key_env: SKS_API_KEY
    model: poolside/laguna-s-2.1:free
    models:
      - poolside/laguna-s-2.1:free
      - qwen/qwen3.8-flash
      - qwen/qwen3.8-27b
      - deepseek/deepseek-v4-flash
image_gen:
  provider: nous
memory:
  provider: honcho
model:
  default: z-ai/glm-5.3-flash
  provider: custom:shikanime-anthropic
platforms:
  api_server:
    enabled: false
plugins:
  enabled:
    - disk-cleanup
    - hermes-lcm
    - ponytail
session_reset:
  mode: none
skills:
  disabled:
    - audiocraft-audio-generation
    - axolotl
    - clip
    - dspy
    - evaluating-llms-harness
    - fine-tuning-with-trl
    - gguf-quantization
    - gif-search
    - grpo-rl-training
    - guidance
    - huggingface-hub
    - llama-cpp
    - modal-serverless-gpu
    - obliteratus
    - openhue
    - outlines
    - peft-fine-tuning
    - product-price-monitor
    - pytorch-fsdp
    - segment-anything-model
    - serving-llms-vllm
    - songwriting-and-ai-music
    - stable-diffusion-image-generation
    - unsloth
    - weights-and-biases
    - whisper
stt:
  provider: nous
tts:
  provider: nous
web:
  backend: nous
